- name: Basic Checks
  block:
  - name: Curl site (ignore SSL cert)
    uri:
      url: "https://{{ inventory_hostname }}{{ item }}"
      method: GET
      validate_certs: no
    register: curl_result
    failed_when: curl_result.status is defined and curl_result.status != 200
    loop:
      - ""
      - "/phpmyadmin"

  rescue:
    - name: Print when error
      debug:
        msg: 'Curl error'