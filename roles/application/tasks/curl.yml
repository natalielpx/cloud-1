- name: Basic Checks
  block:
  - name: Curl site (ignore SSL cert)
    uri:
      url: "https://{{ inventory_hostname }}{{ item }}"
      method: GET
      validate_certs: no
      status_code: 200

    loop:
      - ""
      - "/phpmyadmin"
    register: result
    until: result.status == 200
    retries: 10
    delay: 5

  rescue:
    - name: Print when error
      debug:
        msg: 'Curl error'